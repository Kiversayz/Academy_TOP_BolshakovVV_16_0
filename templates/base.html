{% load static %}
<!-- Модальные окна -->
{% include 'includes/modals/delete_confirm.html' %}
{% include 'includes/modals/export_options.html' %}

<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мой проект{% endblock %}</title>
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="role-{{ user_role|lower }}">
    {% include 'includes/role_badges.html' %}
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary px-4">
        <a class="navbar-brand" href="/">🏠 Главная</a>
        <div class="ms-auto">
            <!-- Переключатель темы -->
            <button id="themeToggle" class="btn btn-outline-secondary" title="Сменить тему">
                <i id="themeIcon" class="bi bi-moon-fill"></i>
            </button>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Подключение собственных скриптов -->
    <script src="{% static 'js/scripts.js' %}"></script>
    <!-- Переключатель темы -->
    <script>
        const toggleButton = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const root = document.documentElement;

        const storedTheme = localStorage.getItem('theme') || 'light';
        root.setAttribute('data-bs-theme', storedTheme);
        themeIcon.className = storedTheme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';

        toggleButton.addEventListener('click', () => {
            const current = root.getAttribute('data-bs-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-bs-theme', next);
            localStorage.setItem('theme', next);
            themeIcon.className = next === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
        });
    </script>
</body>
</html>
