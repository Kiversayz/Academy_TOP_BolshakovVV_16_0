<!DOCTYPE html>
<html>
<head>
    <title>Список шаблонов</title>
    <!-- Подключите Bootstrap для стилей (опционально) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Шаблоны карточек</h1>
        <div class="row">
            {% for template in templates %}
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <!-- Блок с изображением -->
                        {% if template.preview_image %}
                            <img 
                                src="{{ template.preview_image.url }}" 
                                class="card-img-top" 
                                alt="{{ template.name }}"
                                style="max-height: 200px; object-fit: cover;"
                            >
                        {% endif %}
                        <div class="card-body">
                            <h5 class="card-title">{{ template.name }}</h5>
                            <p class="card-text">
                                Автор: {{ template.creator.email }}
                            </p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
