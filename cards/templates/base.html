{% load static %}


<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PlayCards Lab{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'cards/css/styles.css' %}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'cards/js/scripts.js' %}" defer></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">
    <header class="bg-blue-600 text-white p-4">
        <nav class="flex items-center justify-between">
            <a href="{% url 'templates_list' %}" class="text-2xl font-semibold">PlayCards Lab</a>
            <div class="space-x-4">
                <a href="{% url 'templates_list' %}" class="hover:text-blue-300">Шаблоны</a>
                <a href="{% url 'create_template' %}" class="hover:text-blue-300">Создать шаблон</a>
                <a href="{% url 'logout' %}" class="hover:text-blue-300">Выйти</a>
            </div>
        </nav>
    </header>

    <main class="py-8">
        <div class="container mx-auto">
            {% block content %}
            <!-- Контент страницы будет вставляться сюда -->
            {% endblock %}
        </div>
    </main>

    <footer class="bg-gray-800 text-white text-center p-4">
        <p>&copy; 2025 PlayCards Lab. Все права защищены.</p>
    </footer>

    <!-- Модальное окно для удаления шаблона -->
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h3 class="text-lg font-semibold mb-4">Вы уверены, что хотите удалить этот шаблон?</h3>
            <form id="delete-form" method="POST">
                {% csrf_token %}
                <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-400">Удалить</button>
                <button type="button" id="cancel-delete" class="ml-4 px-4 py-2 rounded-md border border-gray-300 hover:bg-gray-100">Отмена</button>
            </form>
        </div>
    </div>

    <!-- Модальное окно для подтверждения загрузки изображения -->
    <div id="image-upload-modal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h3 class="text-lg font-semibold mb-4">Загрузить новое изображение?</h3>
            <form id="upload-form" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="file" name="image" accept="image/*" class="mb-4 p-2 border border-gray-300 rounded-md">
                <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-400">Загрузить</button>
                <button type="button" id="cancel-upload" class="ml-4 px-4 py-2 rounded-md border border-gray-300 hover:bg-gray-100">Отмена</button>
            </form>
        </div>
    </div>
</body>
</html>
